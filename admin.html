<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KBTV Admin Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .admin-login {
            max-width: 420px;
            width: 100%;
            margin: 20px;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .admin-login .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .admin-login .logo span {
            color: #4CAF50;
        }
        .admin-login .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .admin-login .shield {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }
        .admin-login h2 {
            text-align: center;
            font-size: 24px;
            color: #333;
            margin-bottom: 5px;
        }
        .admin-login .form-group {
            margin-bottom: 20px;
        }
        .admin-login label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        .admin-login input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .admin-login input:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }
        .admin-login button {
            width: 100%;
            padding: 14px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .admin-login button:hover {
            background: #45a049;
        }
        .admin-login button:active {
            transform: scale(0.98);
        }
        .admin-login button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .error-message {
            color: #f44336;
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            min-height: 20px;
        }
        .admin-login .links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
        .admin-login .links a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: 500;
        }
        .admin-login .links a:hover {
            text-decoration: underline;
        }
        .admin-login .divider {
            border: none;
            border-top: 1px solid #eee;
            margin: 20px 0;
        }
        .admin-login .info-box {
            background: #e3f2fd;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #1565c0;
            text-align: center;
            margin-top: 15px;
        }
        .admin-login .info-box strong {
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="admin-login">
        <div class="logo">🎬 KBTV <span>Admin</span></div>
        <div class="subtitle">Administrator Access Only</div>
        
        <div class="shield">🔐</div>
        <h2>Admin Login</h2>
        <p style="text-align:center;color:#888;font-size:14px;margin-bottom:25px;">
            Enter your admin credentials to continue
        </p>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="adminEmail">📧 Admin Email</label>
                <input 
                    type="email" 
                    id="adminEmail" 
                    placeholder="admin@kbtv.com" 
                    required 
                    autocomplete="email"
                />
            </div>
            <div class="form-group">
                <label for="adminPassword">🔑 Password</label>
                <input 
                    type="password" 
                    id="adminPassword" 
                    placeholder="Enter your password" 
                    required 
                    autocomplete="current-password"
                />
            </div>
            
            <button type="submit" id="loginBtn">
                🚀 Login as Admin
            </button>
            
            <div id="loginError" class="error-message"></div>
        </form>

        <hr class="divider" />

        <div class="links">
            <a href="index.html">← Back to Home</a> &nbsp;|&nbsp; 
            <a href="setup-admin.html">⚙️ Setup Admin</a>
        </div>

        <div class="info-box">
            <strong>⚠️ Admin Access Only</strong>
            This area is restricted to authorized administrators only.
            Unauthorized access is prohibited.
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase.js';
        import { 
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const form = document.getElementById('adminLoginForm');
        const emailInput = document.getElementById('adminEmail');
        const passwordInput = document.getElementById('adminPassword');
        const errorDiv = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            errorDiv.textContent = '';
            
            if (!email || !password) {
                errorDiv.textContent = '❌ Please enter both email and password.';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ Logging in...';

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const userDoc = await getDoc(doc(db, 'users', user.uid));
                const userData = userDoc.data();
                
                if (userData && userData.role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    errorDiv.textContent = '❌ Access denied. Admin privileges required.';
                    await signOut(auth);
                    loginBtn.disabled = false;
                    loginBtn.textContent = '🚀 Login as Admin';
                }
            } catch (error) {
                let message = '';
                switch (error.code) {
                    case 'auth/user-not-found':
                        message = 'No account found with this email.';
                        break;
                    case 'auth/wrong-password':
                        message = 'Incorrect password. Please try again.';
                        break;
                    case 'auth/invalid-email':
                        message = 'Invalid email format.';
                        break;
                    default:
                        message = error.message;
                }
                errorDiv.textContent = '❌ ' + message;
                loginBtn.disabled = false;
                loginBtn.textContent = '🚀 Login as Admin';
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDoc = await getDoc(doc(db, 'users', user.uid));
                    const userData = userDoc.data();
                    if (userData && userData.role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        await signOut(auth);
                    }
                } catch (error) {
                    console.error('Error checking admin status:', error);
                }
            }
        });

        console.log('✅ admin.html loaded');
    </script>

</body>
</html>
