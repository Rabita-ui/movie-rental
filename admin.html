<!-- setup-admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KBTV - Setup Admin</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .setup-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .setup-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-primary:hover {
            background: #45a049;
        }
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .info {
            background: #cce5ff;
            color: #004085;
        }
        .loading {
            background: #fff3cd;
            color: #856404;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🎬 KBTV</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="admin-dashboard.html">Admin</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="setup-container">
            <h2>🔑 Setup Admin Account</h2>
            <p style="text-align:center;color:#666;margin-bottom:20px;">
                Make an existing user an administrator
            </p>
            
            <div class="form-group">
                <label for="adminEmail">Admin Email Address</label>
                <input 
                    type="email" 
                    id="adminEmail" 
                    placeholder="Enter the email you want to make admin"
                    required
                />
            </div>
            
            <div class="form-group">
                <label for="adminPassword">Your Password</label>
                <input 
                    type="password" 
                    id="adminPassword" 
                    placeholder="Enter your password to confirm"
                    required
                />
            </div>
            
            <button id="setupBtn" onclick="setupAdmin()" class="btn-primary">
                Make this user an Admin
            </button>
            
            <div id="result" class="result"></div>
        </div>
    </main>

    <!-- =========================
         FIREBASE AUTH - UPDATED
    ========================= -->

    <script type="module">
        // ============ IMPORT FROM FIREBASE.JS ============
        import { auth, db } from './firebase.js';
        import { 
            signInWithEmailAndPassword,
            onAuthStateChanged,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { 
            doc, 
            setDoc,
            getDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ============ SETUP ADMIN FUNCTION ============
        window.setupAdmin = async function() {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const resultDiv = document.getElementById('result');
            const setupBtn = document.getElementById('setupBtn');
            
            // Clear previous messages
            resultDiv.className = 'result';
            
            // Validate inputs
            if (!email || !password) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '❌ Please enter both email and password';
                return;
            }

            // Disable button during processing
            setupBtn.disabled = true;
            setupBtn.textContent = '⏳ Processing...';

            try {
                // Show loading status
                resultDiv.className = 'result loading';
                resultDiv.innerHTML = '⏳ Logging in and setting up admin...';
                
                // Sign in with the provided credentials
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                console.log('✅ Logged in as:', user.email);

                // Check if user document exists, create if not
                const userRef = doc(db, 'users', user.uid);
                const userDoc = await getDoc(userRef);
                
                if (!userDoc.exists()) {
                    // Create user document if it doesn't exist
                    await setDoc(userRef, {
                        email: user.email,
                        role: 'admin',
                        createdAt: serverTimestamp(),
                        uid: user.uid,
                        fullName: user.displayName || 'Admin'
                    });
                    console.log('✅ Created new user document with admin role');
                } else {
                    // Update existing user to admin
                    await setDoc(userRef, {
                        role: 'admin',
                        updatedAt: serverTimestamp()
                    }, { merge: true });
                    console.log('✅ Updated existing user to admin role');
                }

                // Update the user's display name
                await updateProfile(user, {
                    displayName: 'Admin'
                });

                // Show success message
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    ✅ <strong>${email}</strong> is now an admin!<br><br>
                    <a href="admin-dashboard.html" style="color:#155724;font-weight:bold;font-size:18px;">
                        🚀 Go to Admin Dashboard →
                    </a>
                `;

            } catch (error) {
                console.error('Setup Error:', error);
                
                // Show user-friendly error message
                let message = '';
                switch (error.code) {
                    case 'auth/user-not-found':
                        message = 'User not found. Please create this account first.';
                        break;
                    case 'auth/wrong-password':
                        message = 'Wrong password. Please try again.';
                        break;
                    case 'auth/invalid-email':
                        message = 'Invalid email format. Please check and try again.';
                        break;
                    case 'auth/too-many-requests':
                        message = 'Too many failed attempts. Please try again later.';
                        break;
                    case 'auth/network-request-failed':
                        message = 'Network error. Please check your internet connection.';
                        break;
                    default:
                        message = error.message;
                }
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '❌ ' + message;
            } finally {
                // Re-enable button
                setupBtn.disabled = false;
                setupBtn.textContent = 'Make this user an Admin';
            }
        };

        // ============ CHECK IF ALREADY ADMIN ============
        onAuthStateChanged(auth, async (user) => {
            const resultDiv = document.getElementById('result');
            
            if (user) {
                try {
                    const userDoc = await getDoc(doc(db, 'users', user.uid));
                    if (userDoc.exists() && userDoc.data().role === 'admin') {
                        resultDiv.className = 'result success';
                        resultDiv.innerHTML = `
                            ✅ You are already an admin!<br><br>
                            <a href="admin-dashboard.html" style="color:#155724;font-weight:bold;font-size:18px;">
                                🚀 Go to Dashboard →
                            </a>
                        `;
                        // Disable the setup button
                        document.getElementById('setupBtn').disabled = true;
                        document.getElementById('setupBtn').textContent = '✅ Already Admin';
                    }
                } catch (error) {
                    console.error('Error checking admin status:', error);
                }
            }
        });

        console.log('✅ setup-admin.html - Firebase imported from firebase.js');
    </script>
</body>
</html>
