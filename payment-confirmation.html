<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KBTV - Payment Confirmation</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">

</head>

<body>


<nav>

    <div class="logo">
        <span>K</span>BTV
    </div>

    <ul>

        <li>
            <a href="index.html">Home</a>
        </li>

        <li>
            <a href="moovie.html">Movies</a>
        </li>

        <li>
            <a href="login.html">Login</a>
        </li>

        <li>
            <button
                id="logoutBtn"
                type="button"
                style="
                    padding: 10px 18px;
                    background: red;
                    color: white;
                    border: none;
                    border-radius: 6px;
                    cursor: pointer;
                ">
                Logout
            </button>
        </li>

    </ul>

</nav>


<section class="payment-page">

    <div class="payment-card">

        <h1>
            Payment Confirmation
        </h1>

        <p>
            Thank you for your payment.
        </p>

        <p>
            Your payment will be verified before
            the movie is made available.
        </p>

        <h2 id="confirmationMovie">
            Movie
        </h2>

        <p>
            Rental Price:
            <strong>₹100</strong>
        </p>

        <button
            id="submitPaymentBtn"
            class="pay-btn"
            type="button">

            Submit Payment Details

        </button>

    </div>

</section>


<footer>

    <h2>KBTV</h2>

    <p>
        © 2026 KBTV Movie Rental
    </p>

</footer>


<script>

const params =
    new URLSearchParams(window.location.search);

const movieNumber =
    params.get("movie") || "1";


const movies = {

    1: "Movie One",
    2: "Movie Two",
    3: "Movie Three",
    4: "Movie Four"

};


const movieTitle =
    movies[movieNumber] || "Movie";


document.getElementById("confirmationMovie").textContent =
    movieTitle;


document.getElementById("submitPaymentBtn")
    .addEventListener("click", function () {

        window.location.href =
            "payment-upload.html?movie=" + movieNumber;

    });

</script>


<script
    type="module"
    src="auth.js">
</script>


</body>

</html>
