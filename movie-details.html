<!-- Add this section to movie-details.html - Place it near the rent button -->

<!-- Movie Details Page - Add this section -->
<div id="rentalStatusContainer" style="margin: 20px 0;"></div>

<!-- Update the rent button to show/hide based on rental status -->
<div id="rentButtonContainer">
    <a href="payment-upload.html?movieId=1&movieTitle=Movie One&price=100" class="btn-rent">
        🎬 Rent Now - ₹100
    </a>
</div>

<!-- Add this script at the end of movie-details.html -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getAuth, 
        onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
        getFirestore, 
        collection, 
        query, 
        where, 
        getDocs,
        onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Get movie details from URL
    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('movieId') || '1';
    const movieTitle = urlParams.get('title') || 'Movie One';
    const moviePrice = urlParams.get('price') || '100';

    // Check authentication and rental status
    onAuthStateChanged(auth, async (user) => {
        const rentalContainer = document.getElementById('rentalStatusContainer');
        const rentButtonContainer = document.getElementById('rentButtonContainer');

        if (!user) {
            // User not logged in - show login prompt
            rentalContainer.innerHTML = `
                <div style="background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 4px solid #ffc107;">
                    <p style="margin:0; color: #856404;">
                        🔐 Please <a href="login.html" style="color: #856404; font-weight: bold;">login</a> to rent or watch this movie.
                    </p>
                </div>
            `;
            return;
        }

        // Check for active rental
        try {
            const rentalsQuery = query(
                collection(db, 'rentals'),
                where('userId', '==', user.uid),
                where('movieId', '==', movieId),
                where('status', '==', 'active')
            );

            const rentalsSnapshot = await getDocs(rentalsQuery);

            if (!rentalsSnapshot.empty) {
                // User has an active rental
                const rentalDoc = rentalsSnapshot.docs[0];
                const rentalData = rentalDoc.data();
                const expiresAt = rentalData.expiresAt.toDate();
                const now = new Date();

                if (expiresAt > now) {
                    // Active rental - show watch button
                    const timeRemaining = expiresAt - now;
                    const hours = Math.floor(timeRemaining / (1000 * 60 * 60));
                    const minutes = Math.floor((timeRemaining % (1000 * 60 * 60)) / (1000 * 60));

                    rentalContainer.innerHTML = `
                        <div style="background: #d4edda; padding: 20px; border-radius: 8px; border-left: 4px solid #28a745;">
                            <h4 style="margin:0 0 10px 0; color: #155724;">✅ You have an active rental!</h4>
                            <p style="margin:5px 0; color: #155724;">
                                ⏱️ Time remaining: <strong>${hours}h ${minutes}m</strong>
                            </p>
                            <p style="margin:5px 0; color: #155724; font-size: 14px;">
                                Expires: ${expiresAt.toLocaleString()}
                            </p>
                            <a href="watch.html?movieId=${movieId}&title=${encodeURIComponent(movieTitle)}" 
                               style="display: inline-block; margin-top: 10px; padding: 12px 30px; 
                                      background: #28a745; color: white; text-decoration: none; 
                                      border-radius: 6px; font-weight: bold;">
                                ▶️ Watch Now
                            </a>
                        </div>
                    `;
                    
                    // Hide the rent button
                    rentButtonContainer.style.display = 'none';

                    // Set up real-time updates for the rental
                    onSnapshot(doc(db, 'rentals', rentalDoc.id), (doc) => {
                        if (doc.exists()) {
                            const data = doc.data();
                            if (data.status !== 'active') {
                                // Rental no longer active - refresh the page
                                location.reload();
                            }
                        }
                    });
                } else {
                    // Rental expired
                    rentalContainer.innerHTML = `
                        <div style="background: #f8d7da; padding: 15px; border-radius: 8px; border-left: 4px solid #dc3545;">
                            <p style="margin:0; color: #721c24;">
                                ⏰ Your rental for this movie has expired. Please rent again to watch.
                            </p>
                        </div>
                    `;
                    // Show rent button
                    rentButtonContainer.style.display = 'block';
                }
            } else {
                // No active rental - check if there's a pending payment
                const pendingQuery = query(
                    collection(db, 'payments'),
                    where('userId', '==', user.uid),
                    where('movieId', '==', movieId),
                    where('status', '==', 'pending')
                );
                const pendingSnapshot = await getDocs(pendingQuery);

                if (!pendingSnapshot.empty) {
                    // There's a pending payment
                    rentalContainer.innerHTML = `
                        <div style="background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 4px solid #ffc107;">
                            <p style="margin:0; color: #856404;">
                                ⏳ Your payment is pending verification. Please wait for admin approval.
                            </p>
                            <p style="margin:5px 0 0 0; color: #856404; font-size: 14px;">
                                Transaction ID: ${pendingSnapshot.docs[0].data().transactionId}
                            </p>
                        </div>
                    `;
                    // Hide rent button
                    rentButtonContainer.style.display = 'none';
                } else {
                    // No rental and no pending payment - show rent button
                    rentalContainer.innerHTML = '';
                    rentButtonContainer.style.display = 'block';
                }
            }
        } catch (error) {
            console.error('Error checking rental status:', error);
            rentalContainer.innerHTML = `
                <div style="background: #f8d7da; padding: 15px; border-radius: 8px; border-left: 4px solid #dc3545;">
                    <p style="margin:0; color: #721c24;">Error checking rental status. Please try again.</p>
                </div>
            `;
        }
    });
</script>
