<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KBTV - Submit Payment</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

<nav>

    <div class="logo">
        <span>K</span>BTV
    </div>

    <ul>

        <li>
            <a href="index.html">Home</a>
        </li>

        <li>
            <a href="moovie.html">Movies</a>
        </li>

        <li>
            <a href="login.html">Login</a>
        </li>

        <li>

            <button
                id="logoutBtn"
                type="button"
                style="
                    padding: 10px 18px;
                    background: red;
                    color: white;
                    border: none;
                    border-radius: 6px;
                    cursor: pointer;
                ">

                Logout

            </button>

        </li>

    </ul>

</nav>


<section class="payment-page">

    <div class="payment-card">

        <h1>
            Submit Payment
        </h1>

        <h2 id="uploadMovieTitle">
            Movie
        </h2>

        <p>
            Rental Price:
            <strong>₹100</strong>
        </p>


        <!-- TRANSACTION NUMBER -->

        <label for="transactionId">
            UPI Transaction / Reference Number
        </label>

        <input
            type="text"
            id="transactionId"
            placeholder="Enter transaction number"
            required>


        <!-- SCREENSHOT -->

        <label for="paymentScreenshot">
            Payment Screenshot
        </label>

        <input
            type="file"
            id="paymentScreenshot"
            accept="image/*"
            required>


        <p class="note">

            Upload the screenshot showing your successful
            ₹100 payment.

        </p>


        <button
            id="submitPayment"
            class="pay-btn"
            type="button">

            Submit Payment

        </button>


        <p
            id="uploadMessage"
            style="margin-top:20px;">
        </p>

    </div>

</section>


<script>

const params =
    new URLSearchParams(window.location.search);

const movieNumber =
    params.get("movie") || "1";


const movies = {

    1: "Movie One",
    2: "Movie Two",
    3: "Movie Three",
    4: "Movie Four"

};


const movieTitle =
    movies[movieNumber] || "Movie";


document.getElementById("uploadMovieTitle")
    .textContent = movieTitle;


// Submit button

document.getElementById("submitPayment")
    .addEventListener("click", function () {

        const transactionId =
            document.getElementById("transactionId").value.trim();

        const screenshot =
            document.getElementById("paymentScreenshot").files[0];

        const message =
            document.getElementById("uploadMessage");


        if (!transactionId) {

            message.textContent =
                "Please enter your transaction/reference number.";

            return;

        }


        if (!screenshot) {

            message.textContent =
                "Please select your payment screenshot.";

            return;

        }


        message.textContent =
            "Payment details received. Upload system will be connected next.";

    });

</script>


<script
    type="module"
    src="auth.js">
</script>


</body>

</html>
