 <!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KBTV - Submit Payment</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<nav>

<div class="logo">
<span>K</span>BTV
</div>

<ul>

<li>
<a href="index.html">Home</a>
</li>

<li>
<a href="moovie.html">Movies</a>
</li>

<li>
<a href="login.html">Login</a>
</li>

<li>
<button
id="logoutBtn"
type="button"
style="
padding:10px 18px;
background:red;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
">
Logout
</button>
</li>

</ul>

</nav>


<section class="payment-page">

<div class="payment-card">

<h1>Submit Payment</h1>

<h2 id="uploadMovieTitle">Movie</h2>

<p>
Rental Price:
<strong>₹100</strong>
</p>


<label for="transactionId">
UPI Transaction / Reference Number
</label>

<input
type="text"
id="transactionId"
placeholder="Enter transaction number"
required>


<label for="paymentScreenshot">
Payment Screenshot
</label>

<input
type="file"
id="paymentScreenshot"
accept="image/*"
required>


<p class="note">
Upload the screenshot showing your successful ₹100 payment.
</p>


<button
id="submitPayment"
class="pay-btn"
type="button">

Submit Payment

</button>


<p
id="uploadMessage"
style="margin-top:20px;">
</p>

</div>

</section>


<script type="module">

import { auth, db } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ================================
   MOVIE INFORMATION
================================ */

const params =
new URLSearchParams(window.location.search);

const movieNumber =
params.get("movie") || "1";


const movies = {

1: "Movie One",

2: "Movie Two",

3: "Movie Three",

4: "Movie Four"

};


const movieTitle =
movies[movieNumber] || "Movie";


document.getElementById("uploadMovieTitle")
.textContent = movieTitle;


/* ================================
   CURRENT USER
================================ */

let currentUser = null;


onAuthStateChanged(auth, (user) => {

currentUser = user;

if (!user) {

document.getElementById("uploadMessage")
.textContent =
"Please login before submitting payment.";

}

});


/* ================================
   SUBMIT PAYMENT
================================ */

document
.getElementById("submitPayment")
.addEventListener("click", async function () {


const transactionId =
document
.getElementById("transactionId")
.value
.trim();


const screenshot =
document
.getElementById("paymentScreenshot")
.files[0];


const message =
document
.getElementById("uploadMessage");


/* CHECK LOGIN */

if (!currentUser) {

message.textContent =
"Please login before submitting payment.";

return;

}


/* CHECK TRANSACTION ID */

if (!transactionId) {

message.textContent =
"Please enter your UPI transaction/reference number.";

return;

}


/* CHECK SCREENSHOT */

if (!screenshot) {

message.textContent =
"Please select your payment screenshot.";

return;

}


/* CHECK IMAGE */

if (!screenshot.type.startsWith("image/")) {

message.textContent =
"Please select an image file.";

return;

}


/* LIMIT SCREENSHOT SIZE */

if (screenshot.size > 5 * 1024 * 1024) {

message.textContent =
"Screenshot must be smaller than 5 MB.";

return;

}


/* SHOW SAVING MESSAGE */

message.textContent =
"Submitting payment details...";


try {


/* SAVE PAYMENT INFORMATION */

const paymentData = {

amount: 100,

currency: "INR",

movieId: movieNumber,

movieTitle: movieTitle,

paymentMethod: "UPI",

transactionId: transactionId,

userId: currentUser.uid,

userEmail: currentUser.email || "",

screenshotName: screenshot.name,

screenshotSize: screenshot.size,

screenshotType: screenshot.type,

status: "pending",

submittedAt: serverTimestamp()

};


/* CREATE FIRESTORE DOCUMENT */

const paymentRef =
await addDoc(
collection(db, "payments"),
paymentData
);


/* SUCCESS */

message.style.color = "green";

message.textContent =
"Payment submitted successfully! Your payment is now pending verification.";


/* CLEAR FORM */

document
.getElementById("transactionId")
.value = "";

document
.getElementById("paymentScreenshot")
.value = "";


/* OPTIONAL: SAVE PAYMENT ID */

console.log(
"Payment ID:",
paymentRef.id
);


}

catch (error) {

console.error(
"Payment submission error:",
error
);

message.style.color = "red";

message.textContent =
"Payment submission failed: " +
error.message;

}

});


</script>


<!-- LOGIN / LOGOUT -->

<script
type="module"
src="auth.js">
</script>


</body>

</html>
