<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KBTV - Payment</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">

</head>

<body>


<!-- =========================
     NAVIGATION
========================= -->

<nav>

    <div class="logo">
        <span>K</span>BTV
    </div>

    <ul>

        <li>
            <a href="index.html">Home</a>
        </li>

        <li>
            <a href="moovie.html">Movies</a>
        </li>

        <li>
            <a href="login.html">Login</a>
        </li>

        <li>
            <button
    id="paidBtn"
    class="pay-btn"
    type="button">

    I've Paid

</button>


<script>

const paymentParams =
    new URLSearchParams(window.location.search);

const selectedMovie =
    paymentParams.get("movie") || "1";


document.getElementById("paidBtn")
    .addEventListener("click", function () {

        window.location.href =
            "payment-confirmation.html?movie=" + selectedMovie;

    });

</script>
        </li>

    </ul>

</nav>


<!-- =========================
     PAYMENT
========================= -->

<section class="payment-page">

    <div class="payment-card">

        <h1>
            Complete Your Rental
        </h1>


        <!-- Movie poster -->

        <img
            id="paymentPoster"
            src="moovie1jpg.jpeg"
            class="movie-payment-poster"
            alt="Movie">


        <!-- Movie title -->

        <h2 id="paymentMovieTitle">
            Movie One
        </h2>


        <!-- Price -->

        <p class="price">
            Rental Price:
            <strong id="paymentPrice">
                ₹100
            </strong>
        </p>


        <h3>
            Scan QR Code
        </h3>


        <!-- Your QR code -->

        <img
            src="Qrc.png"
            class="qr-image"
            alt="QR Code">


        <p class="upi-title">
            UPI ID
        </p>


        <div class="upi-box">

            <input
                type="text"
                value="9862728802m@pnb"
                readonly>

        </div>


        <p class="note">

            After payment, keep your screenshot safe.
            In the next step, you will be able to submit
            your payment for verification.

        </p>


        <button
            id="paidBtn"
            class="pay-btn"
            type="button">

            I've Paid

        </button>

    </div>

</section>


<!-- =========================
     MOVIE INFORMATION
========================= -->

<script>

const movies = {

    1: {
        title: "Movie One",
        image: "moovie1jpg.jpeg",
        price: "₹100"
    },

    2: {
        title: "Movie Two",
        image: "moovie2jpg.jpeg",
        price: "₹100"
    },

    3: {
        title: "Movie Three",
        image: "moovie3jpg.jpeg",
        price: "₹100"
    },

    4: {
        title: "Movie Four",
        image: "moovie4jpg.jpeg",
        price: "₹100"
    }

};


// Read movie number from URL

const params =
    new URLSearchParams(window.location.search);

const movieNumber =
    params.get("movie") || "1";


// Find movie

const movie =
    movies[movieNumber];


// Display movie

if (movie) {

    document.getElementById("paymentPoster").src =
        movie.image;

    document.getElementById("paymentMovieTitle").textContent =
        movie.title;

    document.getElementById("paymentPrice").textContent =
        movie.price;

}

</script>


<!-- Firebase Authentication -->

<script
    type="module"
    src="auth.js">
</script>


</body>

</html>
