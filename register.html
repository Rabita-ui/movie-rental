<section class="login-page">

<div class="login-box">

<h1>Create Account</h1>

<p>Join KBTV and enjoy premium movies.</p>

<form id="registerForm">

<input
id="name"
type="text"
placeholder="Full Name"
required>

<input
id="email"
type="email"
placeholder="Email Address"
required>

<input
id="mobile"
type="tel"
placeholder="Mobile Number"
required>

<input
id="password"
type="password"
placeholder="Password"
required>

<input
id="confirmPassword"
type="password"
placeholder="Confirm Password"
required>

<button type="submit">
Create Account
</button>

</form>

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>
