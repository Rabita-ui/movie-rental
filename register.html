<section class="login-page">

<div class="login-box">

<h1>Create Account</h1>

<p>Join KBTV and enjoy premium movies.</p>

<form>

<input
type="text"
placeholder="Full Name"
required>

<input
type="email"
placeholder="Email Address"
required>

<input
type="tel"
placeholder="Mobile Number"
required>

<input
type="password"
placeholder="Password"
required>

<input
type="password"
placeholder="Confirm Password"
required>

<button type="submit">

Create Account

</button>

</form>

<p>
